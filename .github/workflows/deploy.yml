name: Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "reference/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run the Step Functions pipeline after deploy"
        type: boolean
        default: false
      start_month:
        description: "Start month (YYYY-MM)"
        type: string
        default: "2025-01"
      end_month:
        description: "End month (YYYY-MM)"
        type: string
        default: "2025-06"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: trip-record-data
  ECS_CLUSTER: trip-record-data
  TASK_FAMILIES: >-
    trip-record-data-download
    trip-record-data-build-raw
    trip-record-data-build-trusted
    trip-record-data-build-spec-hourly-volume
    trip-record-data-build-spec-daily-volume
    trip-record-data-build-spec-trip-distance
    trip-record-data-build-spec-distance-fare
  STATE_MACHINE_ARN: ${{ secrets.STATE_MACHINE_ARN }}

jobs:
  # ── Build Docker image and push to ECR ──────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker buildx build \
            --platform linux/arm64 \
            --push \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            -f app/Dockerfile \
            .
          echo "image=${IMAGE}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # ── Register new ECS task definition revisions ──────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definitions
        env:
          NEW_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          for FAMILY in ${TASK_FAMILIES}; do
            echo "Updating task definition: ${FAMILY}"

            TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "${FAMILY}" \
              --query taskDefinition)

            UPDATED=$(echo "${TASK_DEF}" | jq \
              --arg IMAGE "${NEW_IMAGE}" \
              '.containerDefinitions[0].image = $IMAGE')

            CLEANED=$(echo "${UPDATED}" | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )')

            echo "${CLEANED}" > task-def.json
            aws ecs register-task-definition --cli-input-json file://task-def.json
            echo "  -> Updated with image: ${NEW_IMAGE}"
          done

  # ── Optionally run the pipeline (manual trigger only) ────────────
  run-pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_pipeline == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Step Functions pipeline
        run: |
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --input "{\"start_month\": \"${{ github.event.inputs.start_month }}\", \"end_month\": \"${{ github.event.inputs.end_month }}\"}" \
            --query 'executionArn' --output text)

          echo "Pipeline started: ${EXECUTION_ARN}"

          while true; do
            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "${EXECUTION_ARN}" \
              --query 'status' --output text)

            echo "Status: ${STATUS}"

            if [ "${STATUS}" = "SUCCEEDED" ]; then
              echo "Pipeline completed successfully"
              break
            elif [ "${STATUS}" = "FAILED" ] || [ "${STATUS}" = "TIMED_OUT" ] || [ "${STATUS}" = "ABORTED" ]; then
              echo "::error::Pipeline ${STATUS}"
              exit 1
            fi

            sleep 30
          done
